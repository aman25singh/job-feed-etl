[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-feed-etl"
version = "0.1.0"
description = "Incremental ETL that turns a job-board API into a deduplicated, queryable DuckDB table"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aman Singh" }]
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jobfeed = "jobfeed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
